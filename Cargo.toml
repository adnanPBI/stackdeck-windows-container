[workspace]
resolver = "2"
members = [
    "crates/stackdeck-types",
    "crates/stackdeck-compose",
    "crates/stackdeck-state",
    "crates/stackdeck-process",
    "crates/stackdeck-hyperv",
    "crates/stackdeck-api",
    "crates/stackdeck-cli",
    "desktop/stackdeck/src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regex
regex = "1"

# Templates
tauri = "=2.5.1"
tauri-build = "=2.2.0"

# Cryptography / security
subtle = "2"
sha2 = "0.10"
rand = "0.8"
windows-sys = "0.59"
base64 = "0.22"
futures-util = "0.3"
fs2 = "0.4"

# Internal crates
stackdeck-types = { path = "crates/stackdeck-types" }
stackdeck-compose = { path = "crates/stackdeck-compose" }
stackdeck-state = { path = "crates/stackdeck-state" }
stackdeck-process = { path = "crates/stackdeck-process" }
stackdeck-hyperv = { path = "crates/stackdeck-hyperv" }
stackdeck-api = { path = "crates/stackdeck-api" }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
