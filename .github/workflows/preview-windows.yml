name: StackDeck Windows unsigned evaluation preview

# Deliberately separate from the publicly trusted 'v*' signing workflow.
# This route is never a stable/production release. It uses a fresh GitHub
# runner, rebuilds from the exact tag SHA, verifies embedded payloads and
# publishes a clearly marked experimental pre-release only after all gates pass.
on:
  push:
    tags:
      - 'preview-v0.6.0-*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: stackdeck-windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - name: Verify exact evaluation tag and source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require immutable source reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ github.sha }}') { throw 'Source is not exact tag SHA.' }
          $expected = 'preview-v0.6.0-' + $sha.Substring(0,12)
          if ('${{ github.ref_name }}' -cne $expected) { throw "Unexpected preview tag; expected $expected" }
          if ((git status --porcelain | Out-String).Trim()) { throw 'Source checkout is not clean.' }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: desktop/stackdeck/package-lock.json

      - name: Install full 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw '7-Zip setup failed' }
          }

      - name: Rust format, full locked tests, source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed' }
          & cargo test --workspace --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Full Rust workspace tests failed' }
          .\scripts\windows\13-Verify-Source-Release.ps1
          if (-not $?) { throw 'Source contract check failed' }

      - name: Locked candidate build — explicitly UNSIGNED
        shell: pwsh
        run: |
          .\scripts\windows\01-Build-Release.ps1 -SkipTests -BundleUnsigned
          if (-not $?) { throw 'Unsigned preview build failed' }

      - name: Test installer migration guard and support-log redaction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/preview-release -Force | Out-Null
          .\scripts\windows\22-Test-NSIS-Guard.ps1 -Output target/preview-release/nsis-guard-test.json
          if (-not $?) { throw 'NSIS historical-user safety test failed' }
          .\scripts\windows\23-Test-Support-Collector.ps1 -Output target/preview-release/support-redaction-test.json
          if (-not $?) { throw 'Support bundle redaction test failed' }

      - name: Independently inspect MSI and NSIS embedded payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exeRoot = 'target/x86_64-pc-windows-msvc/release'
          $desktop = Join-Path $exeRoot 'stackdeck.exe'
          $hive = 'target/release/stackdeck-hive.exe'
          $stage = 'desktop/stackdeck/src-tauri/bin/stackdeck-hive-x86_64-pc-windows-msvc.exe'
          $compat = 'desktop/stackdeck/src-tauri/bin/stackdeck-hive.exe'
          foreach($file in @($desktop,$hive,$stage,$compat)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing preview payload: $file" }
          }
          $hiveHashes = @(@($hive,$stage,$compat) | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
          } | Sort-Object -Unique)
          if($hiveHashes.Count -ne 1) { throw 'Hive payloads diverge' }
          New-Item -ItemType Directory -Path target/preview-release -Force | Out-Null
          $pre = [ordered]@{
            schema='https://stackdeck.dev/schemas/windows-prebundle-payloads-v1.json'
            desktop_sha256=(Get-FileHash -LiteralPath $desktop -Algorithm SHA256).Hash.ToLowerInvariant()
            hive_sha256=$hiveHashes
          }
          $manifest='target/preview-release/PRE_BUNDLE_PAYLOAD_SHA256.json'
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path $manifest), ($pre | ConvertTo-Json -Depth 4))
          .\scripts\windows\10-Verify-Installer-Payloads.ps1 -ExpectedPayloadManifest $manifest -SkipSignature
          if (-not $?) { throw 'Installer embedded payload verification failed' }

      - name: Record unsigned, exact-commit checksums and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='target/preview-release'
          $artifacts = @(
            'target/x86_64-pc-windows-msvc/release/bundle/msi/StackDeck_0.6.0_x64_en-US.msi',
            'target/x86_64-pc-windows-msvc/release/bundle/nsis/StackDeck_0.6.0_x64-setup.exe',
            'target/release/stackdeck-cli.exe',
            'target/release/stackdeck-hive.exe',
            'target/x86_64-pc-windows-msvc/release/stackdeck.exe',
            'scripts/windows/21-Collect-StackDeckSupport.ps1'
          )
          $hashLines=@()
          $evidence=@()
          foreach($file in $artifacts) {
            if(!(Test-Path $file -PathType Leaf)){throw "Missing artifact $file"}
            $sig = if($file -match '\.(exe|msi)$') {(Get-AuthenticodeSignature $file).Status.ToString()}else{'NotApplicable'}
            if($file -match '\.(exe|msi)$' -and $sig -ne 'NotSigned'){throw "Unexpected signing state $file $sig"}
            $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines+=("$hash  $file")
            $evidence+=@{path=$file;sha256=$hash;authenticode=$sig}
          }
          [IO.File]::WriteAllLines((Join-Path $root 'SHA256SUMS.txt'),$hashLines)
          $lock='runtime/windows-runtime-lock.json'
          $report=[ordered]@{
            schema='stackdeck-unsigned-evaluation-preview-v1'
            commit='${{ github.sha }}'
            tag='${{ github.ref_name }}'
            generated_utc=[datetime]::UtcNow.ToString('o')
            windows_runner='${{ runner.os }}'
            immutable_runtime_lock_sha256=(Get-FileHash $lock -Algorithm SHA256).Hash.ToLowerInvariant()
            embedded_payloads_verified=$true
            unsigned=$true
            public_trust_satisfied=$false
            independent_clean_client_qualified=$false
            production_release_go=$false
            artifacts=$evidence
          }
          [IO.File]::WriteAllText((Join-Path $root 'provenance.json'),($report|ConvertTo-Json -Depth 7))

      - name: Upload unsigned preview review assets
        uses: actions/upload-artifact@v4
        with:
          name: stackdeck-unsigned-evaluation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/StackDeck_0.6.0_x64_en-US.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/StackDeck_0.6.0_x64-setup.exe
            target/release/stackdeck-cli.exe
            target/release/stackdeck-hive.exe
            target/x86_64-pc-windows-msvc/release/stackdeck.exe
            scripts/windows/21-Collect-StackDeckSupport.ps1
            docs/SUPPORT_AND_TROUBLESHOOTING.md
            docs/UNSIGNED_PREVIEW_RELEASE.md
            target/preview-release/*.json
            target/preview-release/SHA256SUMS.txt

      - name: Publish explicit UNSIGNED evaluation pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $assets=@(
            'target/x86_64-pc-windows-msvc/release/bundle/msi/StackDeck_0.6.0_x64_en-US.msi',
            'target/x86_64-pc-windows-msvc/release/bundle/nsis/StackDeck_0.6.0_x64-setup.exe',
            'target/release/stackdeck-cli.exe',
            'target/release/stackdeck-hive.exe',
            'target/x86_64-pc-windows-msvc/release/stackdeck.exe',
            'scripts/windows/21-Collect-StackDeckSupport.ps1',
            'target/preview-release/SHA256SUMS.txt',
            'target/preview-release/PRE_BUNDLE_PAYLOAD_SHA256.json',
            'target/preview-release/provenance.json',
            'target/preview-release/nsis-guard-test.json',
            'target/preview-release/support-redaction-test.json'
          )
          if(@($assets|Where-Object {!(Test-Path -LiteralPath $_ -PathType Leaf)}).Count){throw 'Not all assets exist'}
          gh release create '${{ github.ref_name }}' @assets --verify-tag --prerelease --title 'StackDeck v0.6.0 — UNSIGNED EVALUATION PREVIEW (not production)' --notes-file docs/UNSIGNED_PREVIEW_RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned preview release creation failed' }
